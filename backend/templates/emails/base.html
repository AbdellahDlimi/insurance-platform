<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TrustPool{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f5f7fa; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); overflow: hidden; }
        .header { background: linear-gradient(135deg, #c8a96e, #8b6914); padding: 24px; text-align: center; }
        .header h1 { color: #ffffff; margin: 0; font-size: 22px; }
        .content { padding: 24px; color: #333; font-size: 15px; line-height: 1.6; }
        .footer { background: #f5f7fa; padding: 16px; text-align: center; border-top: 1px solid #e8e8e8; color: #aaa; font-size: 11px; }
        .btn { display: inline-block; padding: 10px 20px; background-color: #c8a96e; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>{% block header_title %}TrustPool{% endblock %}</h1>
        </div>
        <div class="content">
            {% block content %}{% endblock %}
        </div>
        <div class="footer">
            Cet email a été envoyé automatiquement par TrustPool.<br>
            Ne pas répondre à cet email.
        </div>
    </div>
</body>
</html>
